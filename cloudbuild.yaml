# =============================================================================
# Radius — Cloud Build pipeline
#
# WHY THIS FILE EXISTS
# --------------------
# `gcloud builds submit --tag IMAGE .` cannot build this project. It looks for a
# Dockerfile at the source root (ours is docker/Dockerfile) and, more importantly,
# it cannot pass --build-arg. Vite inlines VITE_* values at BUILD time, so without
# build args the deployed bundle would ship with an empty Firebase config and no
# Maps key — sign-in and the map would silently fail in production while the build
# itself reported success.
#
# This config passes them explicitly, so what deploys is actually configured.
#
# WHAT IS AND IS NOT A SECRET HERE
# --------------------------------
# The VITE_* values are public by design: the Firebase web config and the Maps key
# are served to every browser. They are protected by Firestore rules and by HTTP
# referrer restrictions on the key, never by being hidden. They are therefore safe
# as substitutions.
#
# GEMINI_API_KEY is NOT here. It is a real secret, lives in Secret Manager, and is
# injected at RUNTIME via --set-secrets. It must never become a build arg, because
# build args are visible in build logs and image history.
#
# USAGE
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_SERVICE=radius,\
# _VITE_FIREBASE_API_KEY=...,_VITE_FIREBASE_AUTH_DOMAIN=...,...
#
# docs/gcp-deployment.md has the full command with every value filled in.
# =============================================================================

substitutions:
  _REGION: asia-south1
  _SERVICE: radius
  _REPO: radius
  _BUCKET: ''
  _AI_PROVIDER: vertex
  _VERTEX_LOCATION: global  # Flash-Lite models are only served from the global endpoint

  # Public web config, inlined into the bundle at build time.
  _VITE_FIREBASE_API_KEY: ''
  _VITE_FIREBASE_AUTH_DOMAIN: ''
  _VITE_FIREBASE_PROJECT_ID: ''
  _VITE_FIREBASE_STORAGE_BUCKET: ''
  _VITE_FIREBASE_MESSAGING_SENDER_ID: ''
  _VITE_FIREBASE_APP_ID: ''
  _VITE_GOOGLE_MAPS_API_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ------------------------------------------------------------------ build
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=docker/Dockerfile
      # BUILD_ID, not COMMIT_SHA: COMMIT_SHA is empty for a manual `gcloud builds submit`.
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      # Empty string keeps the SPA on same-origin /api, which is what the
      # single-service deployment wants.
      - --build-arg=VITE_API_BASE_URL=
      - --build-arg=VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg=VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg=VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}
      - --build-arg=VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - --build-arg=VITE_GOOGLE_MAPS_API_KEY=${_VITE_GOOGLE_MAPS_API_KEY}
      - .

  # ------------------------------------------------------------------- push
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  # ----------------------------------------------------------------- deploy
  #
  # Runtime configuration lives here, not in the image, so the same artifact can be
  # promoted between environments. The Gemini key arrives from Secret Manager and is
  # never baked in.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_SERVICE}-run@$PROJECT_ID.iam.gserviceaccount.com
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=60s
      # TZ: the Today / Tomorrow / Weekend filters use the server's local day; Cloud Run defaults to UTC.
      - --set-env-vars=NODE_ENV=production,TZ=Asia/Kolkata,SERVE_STATIC=true,GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET=${_BUCKET},AI_PROVIDER=${_AI_PROVIDER},VERTEX_LOCATION=${_VERTEX_LOCATION}
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,MAINTENANCE_TOKEN=maintenance-token:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

timeout: 1200s
